<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>支持 · 现场记录</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav class="nav"><img src="assets/app-icon.png"><strong>现场记录 FieldProof</strong><div class="links"><a href="index.html">首页</a><a href="privacy.html">隐私</a></div></nav><article class="doc"><h1>支持</h1><h2>怎么用？</h2><p>填写项目名称、客户和地址，点「新增检查项」，添加照片和备注，最后点「导出 PDF」。</p><h2>数据在哪里？</h2><p>项目保存在本机。导出的 PDF 通过系统分享面板保存或发送。</p><h2>联系</h2><p>请通过 App Store 产品页的「App 支持」或 <a href="https://github.com/zjloveit/zjloveit.github.io/issues">GitHub Issues</a> 联系。</p></article><p class="footer">© 2026 jin zhang</p></div></body></html>
